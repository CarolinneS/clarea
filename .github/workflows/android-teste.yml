name: APK de teste (Android)

# Gera um APK de TESTE do Clarea dentro do Capacitor, para a prova técnica P-017.
# NÃO é para a Play Store: usa o identificador provisório app.clarea.teste e a chave de depuração.
# Como usar: aba Actions > "APK de teste (Android)" > Run workflow. Ao terminar, o arquivo
# fica em "Artifacts" na página da execução (baixa um .zip com o APK dentro).
# Também roda sozinho em pull requests que mexam nestes arquivos, para validar o próprio fluxo.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-teste.yml'
      - 'capacitor.config.json'
      - 'scripts/preparar-www.mjs'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # O Capacitor (e o plugin App, do botão Voltar) é instalado só aqui, dentro do fluxo (não vai para o repositório).
      # Sem --no-save de propósito: o 'cap sync' só reconhece plugins listados no package.json.
      - name: Instalar o Capacitor 8 (só neste fluxo)
        run: npm install --no-audit --no-fund @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8 @capacitor/app@^8 @capacitor/filesystem@^8 @capacitor/share@^8

      - name: Copiar os arquivos do app para www/
        env:
          APK_BUILD: ${{ github.run_number }}
        run: node scripts/preparar-www.mjs

      - name: Criar o projeto Android (não fica no repositório)
        run: npx cap add android

      - name: Sincronizar
        run: npx cap sync android

      - name: Conferir que os plugins (Voltar, arquivos e compartilhar) entraram no app
        run: |
          cat android/app/src/main/assets/capacitor.plugins.json
          for p in "plugins.app.AppPlugin" "plugins.filesystem.FilesystemPlugin" "plugins.share.SharePlugin"; do grep -q "$p" android/app/src/main/assets/capacitor.plugins.json || { echo "FALTA o plugin $p"; exit 1; }; done

      - name: Aceitar as licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gerar o APK de depuração
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: clarea-apk-de-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
